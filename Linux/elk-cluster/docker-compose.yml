version: "3.8"

name: elk-cluster

services:
  es01:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/elasticsearch:${STACK_VERSION}
    container_name: es01
    environment:
      - node.name=es01
      - cluster.name=elk-docker
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03

      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}

      # ✅ 7.17: 开启账号密码（无需 xpack.security.autoconfiguration.enabled）
      - xpack.security.enabled=true

      # ✅ 不用证书：HTTP/Transport 都是明文（仅建议本地/内网）
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false

      # ✅ 首次启动设置 elastic 密码（仅第一次初始化数据目录时生效）
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65535, hard: 65535 }
    volumes:
      - es01-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks: [elk]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u ${ELASTIC_USER}:${ELASTIC_PASSWORD} http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  es02:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/elasticsearch:${STACK_VERSION}
    container_name: es02
    environment:
      - node.name=es02
      - cluster.name=elk-docker
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}

      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false

      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65535, hard: 65535 }
    volumes:
      - es02-data:/usr/share/elasticsearch/data
    networks: [elk]
    depends_on:
      es01:
        condition: service_healthy

  es03:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/elasticsearch:${STACK_VERSION}
    container_name: es03
    environment:
      - node.name=es03
      - cluster.name=elk-docker
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}

      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false

      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65535, hard: 65535 }
    volumes:
      - es03-data:/usr/share/elasticsearch/data
    networks: [elk]
    depends_on:
      es01:
        condition: service_healthy

  kibana:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/kibana:${STACK_VERSION}
    container_name: kibana
    environment:
      - SERVER_NAME=kibana
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=${ELASTIC_USER}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "5601:5601"
    networks: [elk]
    depends_on:
      es01:
        condition: service_healthy

  logstash:
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/logstash:${STACK_VERSION}
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms${LS_HEAP} -Xmx${LS_HEAP}
      - xpack.monitoring.enabled=false
      - ELASTIC_USER=${ELASTIC_USER}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "8080:8080"
      - "9600:9600"
    networks: [elk]
    depends_on:
      es01:
        condition: service_healthy

networks:
  elk:
    driver: bridge

volumes:
  es01-data:
  es02-data:
  es03-data:
