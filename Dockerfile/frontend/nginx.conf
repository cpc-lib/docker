# ================================================================
# nginx 完整配置模板
# --------------------------------------------------------------
# 涵盖：前端静态资源 / HTTP反向代理 / WebSocket / HTTPS /
#       限流 / 缓存 / gzip / 安全头 / 健康检查 /
#       TCP代理 / UDP代理 / 负载均衡策略
# --------------------------------------------------------------
# 模块结构：events -> http -> stream  （stream 与 http 顶级并列，不能嵌套）
# ================================================================

# ----------------------
# 全局指令
# ----------------------
user  nginx;                          # 运行用户
worker_processes  auto;               # 工作进程数：auto=CPU核数；也可指定具体数字如 4
worker_rlimit_nofile 65535;           # 每个 worker 进程最大打开文件描述符数

error_log  /var/log/nginx/error.log warn;   # 错误日志路径与级别：debug|info|notice|warn|error|crit
pid        /var/run/nginx.pid;              # PID 文件路径

# ================================================================
# 事件模块：连接处理
# ================================================================
events {
    worker_connections  10240;        # 单个 worker 最大并发连接数
    use epoll;                         # Linux 事件模型：select|poll|kqueue|epoll（Linux 推荐 epoll）
    multi_accept on;                   # 一次性接收多个连接，提高并发
}

# ================================================================
# HTTP 模块：HTTP/HTTPS 服务、反向代理、WebSocket、负载均衡
# ================================================================
http {
    # ------------------------------------------------------------
    # 基础配置
    # ------------------------------------------------------------
    include       /etc/nginx/mime.types;        # 文件类型映射表
    default_type  application/octet-stream;     # 默认类型
    server_tokens off;                           # 隐藏 nginx 版本号（安全）

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;

    # ------------------------------------------------------------
    # 性能调优
    # ------------------------------------------------------------
    sendfile        on;                 # 零拷贝传输，提高静态文件传输效率
    tcp_nopush      on;                 # 启用 TCP_CORK，等待数据包凑大后发送（配合 sendfile）
    tcp_nodelay     on;                 # 禁用 Nagle 算法，小数据立即发送（与 tcp_nopush 互斥，nginx 会自动切换）
    keepalive_timeout  65;              # 客户端 keep-alive 超时秒数
    keepalive_requests 1000;            # 单个 keep-alive 连接最大请求数
    reset_timedout_connection on;       # 超时连接立即 reset
    client_body_timeout 30s;            # 读取请求体超时
    client_header_timeout 30s;          # 读取请求头超时
    send_timeout 30s;                   # 发送响应超时

    # ------------------------------------------------------------
    # 请求体大小限制（防大文件攻击）
    # ------------------------------------------------------------
    client_max_body_size 50m;           # 最大请求体：50m，上传文件场景按需调大
    client_body_buffer_size 1m;        # 请求体缓冲区大小
    large_client_header_buffers 4 16k;  # 大请求头缓冲区

    # ------------------------------------------------------------
    # gzip 压缩（减小传输体积）
    # ------------------------------------------------------------
    gzip on;
    gzip_min_length 1k;                 # 小于 1k 不压缩
    gzip_comp_level 6;                 # 压缩级别 1-9，6 较均衡
    gzip_types text/plain text/css text/javascript
               application/javascript application/json application/xml
               application/rss+xml image/svg+xml;
    gzip_vary on;                       # 响应头加 Vary: Accept-Encoding
    gzip_disable "MSIE [1-6]\.";       # 旧 IE 不压缩

    # ------------------------------------------------------------
    # 限流配置（防恶意刷接口）
    # ------------------------------------------------------------
    # 按 IP 限流：每秒 10 个请求，突发 20 个
    limit_req_zone $binary_remote_addr zone=req_limit:10m rate=10r/s;
    # 按连接数限流：单 IP 并发不超过 50
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ------------------------------------------------------------
    # 代理缓冲配置（反代后端时使用）
    # ------------------------------------------------------------
    proxy_buffering on;
    proxy_buffer_size 4k;              # 第一块响应头缓冲区
    proxy_buffers 8 4k;                # 后续响应体缓冲区：8 个 4k
    proxy_busy_buffers_size 16k;       # 忙时缓冲区
    proxy_max_temp_file_size 1024m;    # 临时文件最大值

    # ------------------------------------------------------------
    # 负载均衡上游：后端API（HTTP）
    # ------------------------------------------------------------
    upstream backend_api {
        # 调度策略（任选其一，默认轮询）
        # 1) 轮询（默认）            - 按顺序逐一分配
        # 2) least_conn;             - 最少连接数优先
        # 3) ip_hash;                - 按 IP hash 保持会话粘性
        # 4) hash $request_uri;      - 按 URI hash 提高缓存命中

        # 节点定义：weight=权重  max_fails=失败次数  fail_timeout=失败后熔断时长
        server backend1:8080 weight=3 max_fails=3 fail_timeout=30s;
        server backend2:8080 weight=1 max_fails=3 fail_timeout=30s;
        # server backend3:8080 backup;   # 备用节点，所有主节点宕机后启用

        # 长连接复用（降低与后端连接开销）
        keepalive 32;
        keepalive_timeout 60s;
    }

    # ------------------------------------------------------------
    # 静态资源缓存：缓存路径
    # ------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                     max_size=1g inactive=60m use_temp_path=off;

    # ------------------------------------------------------------
    # 主站点（HTTP）
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name localhost;

        # 安全相关 HTTP 头
        add_header X-Frame-Options "SAMEORIGIN" always;        # 防 iframe 嵌套
        add_header X-Content-Type-Options "nosniff" always;    # 防 MIME 嗅探
        add_header X-XSS-Protection "1; mode=block" always;    # XSS 过滤
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 健康检查端点（供 docker/k8s 探针使用）
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 前端静态资源
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;   # SPA 路由刷新兜底

            # 静态文件缓存策略：html 不缓存，js/css/图片长缓存
            location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                expires off;
            }
        }

        # HTTP 反向代理 → 后端API
        # ex: 前端请求 /api/xxx → 转发到 backend_api/xxx
        location /api/ {
            limit_req zone=req_limit burst=20 nodelay;   # 限流
            limit_conn conn_limit 50;                     # 并发限制

            proxy_pass http://backend_api/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # 代理缓存（GET/HEAD 才缓存）
            proxy_cache api_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # WebSocket 反向代理
        # ex: 前端连接 /ws → 转发到 backend_api/ws
        location /ws {
            proxy_pass http://backend_api/ws;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

            # WebSocket 必需：升级协议
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";

            # 长连接超时（默认60s 会断开 WS，需调大）
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 60s;

            # 关闭代理缓冲，避免 WS 数据延迟
            proxy_buffering off;
        }

        # 长连接 SSE（Server-Sent Events）反向代理
        location /sse {
            proxy_pass http://backend_api/sse;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_buffering off;                # 关键：不缓冲才能实时推送
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
        }

        # 错误页
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ------------------------------------------------------------
    # HTTPS 站点（需提供证书，按需启用）
    # ------------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/server.crt;
    #     ssl_certificate_key /etc/nginx/ssl/server.key;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS：强制后续都走 HTTPS（生产环境用）
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # 以下配置同 80 端口（静态/反代/WS），此处省略
    #     location / { ... }
    # }

    # ------------------------------------------------------------
    # HTTP → HTTPS 跳转（启用 HTTPS 时打开）
    # ------------------------------------------------------------
    # server {
    #     listen 80;
    #     server_name your-domain.com;
    #     return 301 https://$host$request_uri;
    # }
}

# ================================================================
# STREAM 模块：TCP/UDP 4层代理（与 http 并列，不能嵌套）
# 用于代理 MySQL / Redis / RabbitMQ / TCP 自定义协议
# ================================================================
stream {
    # 日志格式
    log_format tcp_log '$remote_addr [$time_local] $protocol $status '
                       '$bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.log tcp_log;

    # ------------------------------------------------------------
    # 负载均衡上游：MySQL TCP 集群
    # ------------------------------------------------------------
    upstream mysql_tcp {
        # least_conn;                    # 最少连接（可选）
        server 192.168.101.90:3306 max_fails=3 fail_timeout=30s;
        # server 192.168.101.91:3306 max_fails=3 fail_timeout=30s;
        # server 192.168.101.92:3306 backup;
    }
    server {
        listen 13306;                   # 对外暴露的代理端口
        proxy_pass mysql_tcp;           # 转发到上游
        proxy_connect_timeout 10s;      # 连接上游超时
        proxy_timeout 300s;             # 空闲会话超时
        # proxy_buffer_size 16k;        # 代理缓冲（默认即可）
    }

    # ------------------------------------------------------------
    # 负载均衡上游：Redis TCP 集群
    # ------------------------------------------------------------
    upstream redis_tcp {
        server 192.168.101.90:6379 max_fails=3 fail_timeout=30s;
        # server 192.168.101.91:6379 max_fails=3 fail_timeout=30s;
    }
    server {
        listen 16379;
        proxy_pass redis_tcp;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }

    # ------------------------------------------------------------
    # TCP 代理示例：RabbitMQ
    # ------------------------------------------------------------
    upstream rabbitmq_tcp {
        server 192.168.101.90:5672;
    }
    server {
        listen 15672;
        proxy_pass rabbitmq_tcp;
        proxy_connect_timeout 10s;
        proxy_timeout 300s;
    }

    # ------------------------------------------------------------
    # UDP 代理示例：DNS
    # ------------------------------------------------------------
    # server {
    #     listen 15353 udp;
    #     proxy_pass 8.8.8.8:53;
    #     proxy_timeout 60s;
    #     proxy_responses 1;              # 期望响应数（DNS 通常1）
    # }

    # ------------------------------------------------------------
    # UDP 代理示例：syslog
    # ------------------------------------------------------------
    # server {
    #     listen 1514 udp;
    #     proxy_pass 192.168.101.90:514;
    #     proxy_timeout 60s;
    # }
}
