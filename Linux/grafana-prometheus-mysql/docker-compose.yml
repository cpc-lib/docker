version: '3.8'

networks:
  monitor-net:
    driver: bridge

services:
  # MySQL 服务
  mysql:
    networks:
      - monitor-net
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/mysql:5.7.44
    container_name: mysql
    restart: unless-stopped
    ports:
        - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "cpc!23#@"
      TZ: Asia/Shanghai
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --max_connections=2000
      --slow_query_log=1
      --slow_query_log_file=/var/lib/mysql/mysql-slow.log
      --long_query_time=1
      --log_queries_not_using_indexes=0
    volumes:
      - ./mysql57/data:/var/lib/mysql
      - ./mysql57/conf:/etc/mysql/conf.d
      - ./mysql57/init:/docker-entrypoint-initdb.d

  # MySQL 采集器
  mysqld-exporter:
    networks:
      - monitor-net
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/mysqld-exporter:v0.18.0
    container_name: mysqld-exporter
    restart: unless-stopped
    command:
      - '--config.my-cnf=/etc/mysql/.my.cnf'
      - '--web.listen-address=:9104'
    volumes:
      - ./exporter-cnf/exporter.cnf:/etc/mysql/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      - mysql


  # Prometheus 监控核心
  prometheus:
    networks:
      - monitor-net
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/prometheus:v3.7.3
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - mysqld-exporter

  # Grafana 可视化
  grafana:
    networks:
      - monitor-net
    image: registry.cn-hangzhou.aliyuncs.com/snow-io/grafana:12.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
