name: qbittorrent

services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WEBUI_PORT: 8080
      TORRENTING_PORT: 6881

    ports:
      - "8080:8080"
      - "6881:6881/tcp"
      - "6881:6881/udp"

    volumes:
      - ./data/config:/config
      - ./data/downloads:/downloads

    networks:
      - download-backend

networks:
  download-backend:
    driver: bridge
