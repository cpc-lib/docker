input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => { "[@metadata][target_index]" => "demo-%{+YYYY.MM.dd}" }
  }
}

output {
  elasticsearch {
    hosts => ["http://es01:9200"]
    user => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    index => "%{[@metadata][target_index]}"
  }
  stdout { codec => rubydebug }
}
